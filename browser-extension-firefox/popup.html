<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vortex Studio Bridge</title>
  <style>
    body {
      margin: 0;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: #0b1220;
      color: #f1f5f9;
      padding: 14px;
      box-sizing: border-box;
    }
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .pill.online { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .pill.offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .sec {
      margin-top: 12px;
    }
    .sec-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .btn {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { filter: brightness(1.1); }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 220px;
      overflow-y: auto;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #131c31;
      border: 1px solid #1e293b;
      border-radius: 7px;
      padding: 7px 9px;
    }
    .row-title {
      font-size: 12px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-sub {
      font-size: 10.5px;
      color: #94a3b8;
    }
    .dl-btn {
      flex-shrink: 0;
      padding: 5px 9px;
      border-radius: 6px;
      border: 0;
      background: #10b981;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11.5px;
      color: #34d399;
      min-height: 16px;
    }
    .status-msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="hdr">
    <span class="brand">Vortex Studio IDM</span>
    <span id="healthBadge" class="pill">Checking...</span>
  </div>

  <div class="sec">
    <button id="scanPageBtn" class="btn">Scan Current Page for Media</button>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Detected Streams on Tab</div>
    <div id="streamList" class="list"></div>
  </div>

  <div class="sec">
    <div class="sec-title">Active Vortex Downloads</div>
    <div id="taskList" class="list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
