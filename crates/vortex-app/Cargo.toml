[package]
name = "vortex-app"
version = "0.1.0"
edition = "2021"
description = "Vortex Unified BitTorrent Client & Intelligent Stream Accelerator Application"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vortex"
path = "src/main.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
vortex-ui = { path = "../vortex-ui" }
winit = "0.30.13"
softbuffer = "0.4.8"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
