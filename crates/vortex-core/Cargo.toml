[package]
name = "vortex-core"
version = "0.2.0"
edition = "2021"
description = "Vortex Unified BitTorrent Engine & Stream Download Accelerator in Pure Rust"
license = "MIT OR Apache-2.0"

[dependencies]
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
